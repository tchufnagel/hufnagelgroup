bio: |
  Todd Hufnagel is Professor of Materials Science and Engineering and, by courtesy, Mechanical Engineering at Johns Hopkins University where is he also the Director of the Artificial Intelligence in Materials Design Laboratory (AIMD-L). His research focuses on three-dimensional characterization of materials using high-energy diffraction microscopy, x-ray phase contrast imaging, applications of machine learning to inverse process design, and autonomous materials experimentation. He is the recipient of an NSF CAREER award, an Army Young Investigator award, and the Capers and Marion McDonald Award for Excellence in Mentoring and Advising, and has held visiting appointments at Sidney Sussex College of Cambridge University, the Institute of Physics at the University of Amsterdam, and Utrecht University.  

  **Education**
  - PhD, Materials Science and Engineering, Stanford University, 1995
  - MS, Materials Science and Engineering, Stanford University, 1991
  - BS, Metallurgical Engineering, Michigan Tech, 1989
    
  [Publications](../../publications/)
     
