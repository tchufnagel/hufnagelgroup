bio: |
  Todd Hufnagel is Professor of Materials Science and Engineering and, by courtesy, Mechanical Engineering at Johns Hopkins University where is he also the Director of the Artificial Intelligence in Materials Design Laboratory (AIMD-L). He earned his B.S. degree in Metallurgical Engineering from Michigan Technological University in 1989, and M.S. and Ph.D. degrees in Materials Science and Engineering from Stanford University in 1991 and 1995, respectively. He began his career at Johns Hopkins in 1996, where his research has emphasized metallic glasses, and x-ray characterization of materials, including time-resolved x-ray diffraction and imaging studies of dynamic deformation, dynamic fracture, and rapid phase transformations in materials. Recent work has focused on three-dimensional characterization of materials using high-energy diffraction microscopy, x-ray phase contrast imaging, applications of machine learning to inverse process design, and autonomous materials experimentation. He is the recipient of an NSF CAREER award, an Army Young Investigator award, and the Capers and Marion McDonald Award for Excellence in Mentoring and Advising, and has held visiting appointments at Sidney Sussex College of Cambridge University, the Institute of Physics at the University of Amsterdam, and Utrecht University.  
     
