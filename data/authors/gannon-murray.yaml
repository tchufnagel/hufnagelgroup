bio: |
  Gannon Murray is a PhD student in the Department of Materials Science and Engineering at Johns Hopkins University. He is co-advised by Todd Hufnagel and David Elbert. His research areas include materials informatics, inverse problems and uncertainty quantification in x-ray diffraction, and applications of edge AI to high-throughput experimentation in service to the Artificial Intelligence for Materials Design Network (AIMD-Net). 
    
